name: Translation fix
description: Suggest a better wording for a German, Spanish, Japanese, Korean or Vietnamese string on the PocketOBI screen
title: "[XX] S_KEY"
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest translation changes for this Hosyond port here. Original language tables
        are inherited from TheRepairforge/PocketOBI. Include the language, string key,
        proposed wording and a screenshot if available. Text must fit the small display.
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: German
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: String key
      description: The S_... key from the review page or the spreadsheet. Leave empty for a full review.
      placeholder: S_BATTERY
  - type: textarea
    id: english
    attributes:
      label: English
  - type: textarea
    id: current
    attributes:
      label: Current translation
  - type: textarea
    id: suggestion
    attributes:
      label: Your suggestion
      description: For a full review, attach the filled spreadsheet (CSV) here instead.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why (optional)
      description: Wrong meaning, unnatural, wrong register, too long...
  - type: input
    id: credit
    attributes:
      label: Credit (optional)
      description: The name to thank in the release notes. Leave empty to stay anonymous.
