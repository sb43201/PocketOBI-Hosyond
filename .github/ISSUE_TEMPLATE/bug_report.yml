name: Hosyond bug report / build help
description: Report a display, touch, battery, Wi-Fi or USB bridge problem in this port.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected, what you saw, and steps to reproduce it.
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release tag or commit
      description: Use the Git release tag (for example hosyond-v1.1.0). The inherited About version identifies upstream code.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: PlatformIO environment
      options:
        - hosyond-cyd28-wifi
        - hosyond-cyd28
        - hosyond-cyd28-diagnostic
        - Other
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board model / revision
      placeholder: Hosyond LCDWiki E32R28T ESP32-32E
    validations:
      required: true
  - type: input
    id: pack
    attributes:
      label: Makita pack model
      placeholder: BL1850B
  - type: textarea
    id: wiring
    attributes:
      label: Wiring and power
      description: Describe DATA/ENABLE GPIOs, adapter contact functions, ground, resistor values and USB or single-cell power. Photos help.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: For standalone battery logs use hosyond-cyd28-diagnostic and Serial Monitor at 115200. Omit passwords and personal network details.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the README wiring for this board (IO23 DATA, IO27 ENABLE), not the original ESP32-C3 pinout.
        - label: I checked that the battery is connected and shared GND/pull-ups are present.
        - label: I removed the microSD card and disconnected other SPI accessories.
